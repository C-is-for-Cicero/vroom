[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vroom"
version = "0.1.0"
description = "Vroom — F1 prediction models, race simulator, and web app"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "fastf1>=3.4",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "passlib[bcrypt]>=1.7",
]
dev = [
    "vroom[web]",
    "pytest>=8",
    "ruff>=0.4",
    "httpx2",  # required by starlette's TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
