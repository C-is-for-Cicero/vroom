{% extends "base.html" %}
{% block title %}Log in — Vroom{% endblock %}
{% block content %}
<div class="panel" style="max-width: 22rem; margin: 3rem auto;">
  <h2 style="margin-top:0">Log in</h2>
  {% if error %}<p class="tag">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <p><input name="username" placeholder="username" required autofocus></p>
    <p><input name="password" type="password" placeholder="password" required></p>
    <p><button type="submit">Log in</button></p>
  </form>
  <p class="muted">Got an invite code? <a href="/register">Create an account</a>.</p>
</div>
{% endblock %}
